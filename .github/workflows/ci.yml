name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    name: api - tests, schema, tenancy, backtest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
      ATLAS_APP_DSN: postgresql://atlas_app:atlas_app@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt pytest httpx

      # The schema must apply cleanly from nothing, every time. A migration that
      # only works against a database someone has already massaged is not a
      # migration.
      - name: apply migrations, then prove re-applying is a no-op
        run: |
          python -I scripts/migrate.py
          python -I scripts/migrate.py | tee /tmp/second.txt
          grep -q "0 applied" /tmp/second.txt

      # Extraction is pure: these run with no data and no database.
      - name: extractor regression tests
        run: python -I -m pytest -q tests/test_extract.py

      # Tenancy is checked against a real database. The point-in-time and
      # propagation suites skip themselves when the graph is empty, which it is
      # on a fresh CI database - they guard the data, not the code.
      - name: schema, tenancy and graph invariants
        run: python -I -m pytest -q tests/

      - name: every edge must cite a sentence
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "DO \$\$ BEGIN
               IF EXISTS (SELECT 1 FROM dependency_edge WHERE chunk_id IS NULL) THEN
                 RAISE EXCEPTION 'an edge exists with no citation';
               END IF;
             END \$\$;"

      - name: row-level security is on and forced
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "DO \$\$ BEGIN
               IF EXISTS (
                 SELECT 1 FROM pg_class
                  WHERE relname IN ('exposure_precompute','universe_member','coverage_universe')
                    AND (NOT relrowsecurity OR NOT relforcerowsecurity)) THEN
                 RAISE EXCEPTION 'a tenant-scoped table is not protected';
               END IF;
             END \$\$;"
