name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  api:
    name: api + scripts — install, compile, validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api scripts
      - run: python -I scripts/validate_collection.py data/companies/*.csv data/aliases/*.csv
