# `docker compose up` from this folder gives any teammate the whole stack locally.
# Getting this working in week 1 pays for itself ten times over.
#
# Every port below is bound to 127.0.0.1 on purpose. Docker's default,
# "5432:5432", publishes on 0.0.0.0, which means anyone on the same network —
# college wifi, a cafe, a shared hostel connection — can reach these. The
# password is "atlas" and pgweb has no login at all, so that default put a
# browser SQL console over the whole dataset on the open network. Binding to
# 127.0.0.1 keeps them reachable from this machine and nowhere else.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - atlas_pg:/var/lib/postgresql/data
      - ./../infra/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Browser-based database viewer, so nobody needs a Postgres client installed.
  # http://localhost:8081 - browse tables, run SQL, export CSV.
  dbui:
    image: sosedoff/pgweb:0.14.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://atlas:atlas@db:5432/atlas?sslmode=disable
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped

volumes:
  atlas_pg:
